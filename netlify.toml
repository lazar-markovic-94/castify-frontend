# Netlify Configuration for Castify Frontend
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Build command (skip TypeScript checking for alpha/dev)
  command = "vite build"

  # Directory to publish (Vite outputs to 'dist' by default)
  publish = "dist"

  # Directory with the netlify.toml file
  base = "/"

# Production context: all deploys from the main branch will inherit these settings
[context.production]
  command = "vite build"

  [context.production.environment]
    NODE_VERSION = "20"

# Deploy Preview context: all Deploy Previews will inherit these settings
[context.deploy-preview]
  command = "vite build"

  [context.deploy-preview.environment]
    NODE_VERSION = "20"

# Branch deploy context: all deploys that are not from a pull/merge request will inherit these settings
[context.branch-deploy]
  command = "vite build"

  [context.branch-deploy.environment]
    NODE_VERSION = "20"

# Redirects for SPA routing - catch-all redirect for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Cache static assets for 1 year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
