# =============================================================================
# Frontend Deployment - Deploy to Netlify on develop branch
# Triggers when code is pushed to develop branch
# =============================================================================

name: Deploy Frontend to Netlify

on:
  push:
    branches:
      - develop
    paths:
      - '**'
      - '.github/workflows/deploy-develop.yml'

jobs:
  build-and-deploy:
    name: Build and Deploy to Netlify
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Build the application (uses .env.production)
      - name: Build application
        run: npx vite build
        env:
          # Vite will use .env.production file for these values
          NODE_ENV: production

      # Deploy to Netlify
      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: './dist'
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions - ${{ github.event.head_commit.message }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      # Deployment summary
      - name: Deployment Summary
        run: |
          echo "✅ Frontend deployed to Netlify"
          echo "🔗 URL: https://castify-alpha.netlify.app"
